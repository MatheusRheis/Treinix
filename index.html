<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0a1020;--card:#1a2a4a;--tx:#f4f6fb;--ac:#fff;--gl:#3b6cff;--on:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background:radial-gradient(700px 480px at 95% -5%,color-mix(in srgb,var(--gl) 55%,transparent),transparent),radial-gradient(600px 520px at -10% 45%,color-mix(in srgb,var(--gl) 30%,transparent),transparent),var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:20px 16px 150px}
h1{font-size:32px;margin:8px 0 16px}
h2{font-size:18px;margin:20px 0 10px}
.c2{background:color-mix(in srgb,var(--tx) 10%,var(--card))}
.mu,.day{color:color-mix(in srgb,var(--tx) 55%,var(--bg))}
.mu{font-size:14px}
.card{background:color-mix(in srgb,var(--card) 45%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:26px;padding:16px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--tx) 14%,transparent)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}.gear{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);background:color-mix(in srgb,var(--card) 45%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.week{display:flex;gap:6px;margin-bottom:16px}
.day{flex:1;background:color-mix(in srgb,var(--card) 45%,transparent);border-radius:18px;padding:8px 0;text-align:center;font-size:12px;border:0;cursor:pointer}
.day b{display:block;font-size:17px;color:var(--tx);margin-top:2px}
.day.on{background:var(--ac);color:var(--on)}.day.on b{color:var(--on)}
.dot{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0}
.dot.y{background:#22c55e}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.g{background:color-mix(in srgb,var(--tx) 10%,var(--card));color:var(--tx)}
.btn.s{padding:6px 12px;font-size:14px}
input,select,textarea{background:color-mix(in srgb,var(--tx) 8%,var(--card));border:1px solid color-mix(in srgb,var(--tx) 15%,var(--card));border-radius:12px;padding:10px;width:100%}
input[type=color]{padding:2px;height:40px}
label{font-size:12px;display:block;margin:8px 0 3px;color:color-mix(in srgb,var(--tx) 55%,var(--bg))}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:color-mix(in srgb,var(--tx) 10%,var(--card));border:0;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:color-mix(in srgb,var(--tx) 60%,var(--bg))}
.chip.on{background:var(--ac);color:var(--on);font-weight:600}
.tag{display:inline-block;background:color-mix(in srgb,var(--tx) 10%,var(--card));border-radius:999px;padding:3px 10px;font-size:12px;margin:6px 6px 0 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 70%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:999px;padding:8px;display:flex;gap:10px}
nav button{width:52px;height:52px;display:grid;place-items:center;background:none;border:0;border-radius:50%;padding:0;cursor:pointer;color:color-mix(in srgb,var(--tx) 60%,var(--bg))}
nav button.on{background:var(--ac);color:var(--on);font-weight:600}
#tbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--ac);color:var(--on);border-radius:20px;padding:10px 14px;align-items:center;gap:8px;box-shadow:0 6px 24px #0006}
#tbar b{font-size:24px;flex:1}
#tbar button{background:#0002;color:inherit;border:0;border-radius:999px;padding:8px 12px;font-weight:600;cursor:pointer}
.ban{display:block;height:130px;border-radius:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--gl) 70%,var(--bg)),color-mix(in srgb,var(--card) 80%,var(--bg)));background-size:cover;background-position:center;position:relative;overflow:hidden}.av{position:absolute;left:16px;bottom:-44px;width:92px;height:92px;border-radius:50%;border:4px solid var(--bg);background:color-mix(in srgb,var(--card) 90%,var(--tx));background-size:cover;background-position:center;display:grid;place-items:center;font-size:36px;font-weight:700;overflow:hidden}.ed{position:absolute;inset:0;display:grid;place-items:center;background:#0006;color:#fff;font-size:13px;font-weight:600;cursor:pointer}.wbn{height:auto;aspect-ratio:3/1}.bleed{margin:-16px -16px 12px;border-radius:25px 25px 0 0}
.stat{flex:1;background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:18px;padding:10px 12px;text-align:center}.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}.stat span{font-size:12px;color:color-mix(in srgb,var(--tx) 60%,var(--bg))}
video{width:100%;border-radius:14px;margin-top:8px;background:#000}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:inherit}
textarea{min-height:110px;font-family:monospace;font-size:12px}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid color-mix(in srgb,var(--tx) 30%,var(--bg));background:none;font-size:18px;cursor:pointer;flex:none}
.ck.on{background:#22c55e;border-color:#22c55e;color:#052e16}
.sr{margin-top:8px}
.sr input{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="tbar"><span>Descanso</span><b id="tt">0:00</b><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="0">Pular</button></div>
<nav id="nav"></nav>
<script>
var DN=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
var TIPOS=["Normal","Aquecimento","Drop set","Bi-set","Super set","Cluster","Rest-pause","Isométrico"];
var FINS=["Força","Hipertrofia","Resistência","Potência","Mobilidade","Alongamento","Estabilidade","Cardio","DSE"];
var S;try{S=JSON.parse(localStorage.getItem("tr")||"")}catch(e){S=null}
if(!S||!S.w)S={w:[]};
S.h=S.h||[];S.lw=S.lw||{};
S.th=S.th||{mode:"dark",bg:"#0a1020",card:"#1a2a4a",tx:"#f4f6fb",ac:"#7c9cff",gl:"#3b6cff"};S.pf=S.pf||{};
var view=(S.pf.done||S.pf.nome)?"home":"onb",sel=(new Date().getDay()+6)%7,edit=null,ses=null,tm=null,pe=false,cf=null;
function save(){try{localStorage.setItem("tr",JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10)}
function alert(m){var e=document.createElement("div");e.textContent=m;e.style.cssText="position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:60;max-width:420px;margin:0 auto;background:var(--ac);color:var(--on);padding:12px 16px;border-radius:16px;font-weight:600;text-align:center";document.body.appendChild(e);setTimeout(function(){e.remove()},3000)}
function nm(s){return String(s||"").trim().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function weekDates(){var t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));return DN.map(function(_,i){return new Date(m.getFullYear(),m.getMonth(),m.getDate()+i)})}
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function dayLogs(i){var k=key(weekDates()[i]);return S.h.filter(function(x){return x.k===k&&!x.skip})}
function wById(id){return S.w.filter(function(x){return x.id===id})[0]}
function nextW(){if(!S.w.length)return null;for(var i=S.h.length-1;i>=0;i--){var j=S.w.indexOf(wById(S.h[i].w));if(j>-1)return S.w[(j+1)%S.w.length]}return S.w[0]}
/* tema */
function lum(h){var n=parseInt(h.slice(1),16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}
function applyTheme(){var t=S.th,P={dark:{bg:"#0a1020",card:"#1a2a4a",tx:"#f4f6fb",ac:"#ffffff",gl:"#3b6cff"},light:{bg:"#eef2fb",card:"#ffffff",tx:"#141a2b",ac:"#141a2b",gl:"#8fb0ff"}},c=t.mode==="custom"?t:P[t.mode]||P.dark,r=document.documentElement.style;
 r.setProperty("--bg",c.bg);r.setProperty("--card",c.card);r.setProperty("--tx",c.tx);r.setProperty("--ac",c.ac);r.setProperty("--gl",c.gl||"#3b6cff");r.setProperty("--on",lum(c.ac)>0.55?"#111":"#fff");r.colorScheme=lum(c.bg)>0.5?"light":"dark"}
/* vídeos */
var db=null;
function openDB(){return new Promise(function(res){if(db)return res(db);try{var r=indexedDB.open("trdb",1);r.onupgradeneeded=function(){r.result.createObjectStore("v")};r.onsuccess=function(){db=r.result;res(db)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function putVid(id,b){return openDB().then(function(d){return new Promise(function(res){if(!d)return res(false);var t=d.transaction("v","readwrite");t.objectStore("v").put(b,id);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)}})})}
function getVid(id){return openDB().then(function(d){return new Promise(function(res){if(!d)return res(null);var q=d.transaction("v").objectStore("v").get(id);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})})}
function loadVids(){document.querySelectorAll("video[data-v]").forEach(function(v){getVid(v.dataset.v).then(function(b){if(b)v.src=URL.createObjectURL(b)})})}
/* timer */
function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},500)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function tick(){var b=document.getElementById("tbar");if(tm){var s=Math.ceil((tm-Date.now())/1000);if(s<=0){tm=null;beep()}else{document.getElementById("tt").textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2)}}b.style.display=tm?"flex":"none"}
setInterval(tick,250);

function render(){
 var h=hd()+(view==="onb"?onb():view==="home"?home():view==="list"?list():view==="edit"?editor():view==="ses"?session():view==="hist"?hist():cfg());
 document.getElementById("app").innerHTML=h;
 var IC={home:"<path d='M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/>",list:"<path d='M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11'/>",hist:"<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>",cfg:"<circle cx='12' cy='8' r='4'/><path d='M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1'/>"},n=[["home","Início"],["list","Treinos"],["hist","Histórico"],["cfg","Perfil"]];
 document.getElementById("nav").innerHTML=n.map(function(x){return '<button data-nav="'+x[0]+'" class="'+((view===x[0]||(view==="edit"&&x[0]==="list")||(view==="ses"&&x[0]==="home"))?"on":"")+'" aria-label="'+x[1]+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[x[0]]+"</svg></button>"}).join("");
 loadVids();loadImgs();document.getElementById("nav").style.display=view==="onb"?"none":"flex";
}
function hd(){if(view==="onb")return "";return "<div class='top'><span class='logo'>Treinix</span>"+(view==="home"?"<button class='gear' data-nav='cfg' aria-label='Configurações'><svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'/></svg></button>":"")+"</div>"}
function hist(){var h="<h1>Histórico</h1>",L=S.h.filter(function(x){return !x.skip}).slice().reverse();if(!L.length)return h+"<div class='card mu'>Nenhum treino registrado ainda.</div>";L.forEach(function(x){var w=wById(x.w),dt=x.k.split("-");h+="<div class='card'><b>"+esc(w?w.name:x.name)+"</b> <span class='mu'>"+("0"+dt[2]).slice(-2)+"/"+("0"+dt[1]).slice(-2)+"/"+dt[0]+"</span>";(x.ex||[]).forEach(function(e){h+="<div class='mu'>"+esc(e.n)+": "+(e.s.filter(function(v){return v!==""}).map(function(v){return esc(v)+" kg"}).join(" · ")||"sem carga")+"</div>"});h+="</div>"});return h}
function home(){
 var wd=weekDates(),h="<h1>"+(S.pf.nome?"Olá, "+esc(nm(S.pf.nome))+"!":"Treinar")+"</h1><div class='week'>";
 wd.forEach(function(d,i){h+="<button class='day"+(i===sel?" on":"")+"' data-day='"+i+"'>"+DN[i]+"<b>"+d.getDate()+"</b><span class='dot"+(dayLogs(i).length?" y":"")+"'></span></button>"});
 h+="</div>";
 var n=nextW();
 h+="<h2>Próximo da sequência</h2>";
 if(!n)h+="<div class='card mu'>Crie seus treinos na aba Treinos. Eles seguem a ordem da lista.</div>";
 else{h+="<div class='card'>"+(n.bn?"<div class='ban wbn bleed' style='margin-bottom:12px' data-im='wb-"+n.id+"'></div>":"")+"<b style='font-size:20px'>"+esc(n.name)+"</b><div class='mu'>"+n.ex.length+" exercícios · para "+DN[sel]+"</div>"+(n.desc?"<div class='mu' style='margin-top:6px;white-space:pre-wrap'>"+esc(n.desc)+"</div>":"");
  
  h+="<div class='row' style='margin-top:14px'><button class='btn' data-start='"+n.id+"'>Iniciar treino</button><button class='btn g' data-skip='"+n.id+"'>Pular</button></div></div>"}
 h+="<h2>Feito em "+DN[sel]+"</h2>";
 var L=dayLogs(sel);
 if(!L.length)h+="<div class='card mu'>Nenhum treino registrado neste dia.</div>";
 L.forEach(function(x){var w=wById(x.w);h+="<div class='card'><b>"+esc(w?w.name:x.name)+"</b>";(x.ex||[]).forEach(function(e){h+="<div class='mu'>"+esc(e.n)+": "+(e.s.filter(function(v){return v!==""}).map(function(v){return esc(v)+" kg"}).join(" · ")||"sem carga")+"</div>"});h+="</div>"});
 return h;
}
function list(){
 var h="<div class='row sp'><h1>Treinos</h1><button class='btn' data-new='1'>+ Novo</button></div><div class='mu' style='margin-bottom:12px'>A ordem desta lista é a sequência de treino.</div>";
 if(!S.w.length)h+="<div class='card mu'>Você ainda não tem treinos.</div>";
 S.w.forEach(function(w,i){h+="<div class='card'>"+(w.bn?"<div class='ban wbn bleed' data-open='"+w.id+"' style='margin-bottom:12px;cursor:pointer' data-im='wb-"+w.id+"'></div>":"")+"<div class='row sp'><div data-open='"+w.id+"' style='cursor:pointer;flex:1'><b style='font-size:18px'>"+(i+1)+". "+esc(w.name)+"</b><div class='mu'>"+w.ex.length+" exercícios</div>"+(w.desc?"<div class='mu' style='margin-top:4px;white-space:pre-wrap'>"+esc(w.desc)+"</div>":"")+"</div><button class='btn g s' data-mv='"+w.id+":-1'>▲</button><button class='btn g s' data-mv='"+w.id+":1'>▼</button></div></div>"});
 return h;
}
function sel2(o,v,k,i){return "<select data-k='"+k+"' data-i='"+i+"'>"+o.map(function(x){return "<option"+(x===v?" selected":"")+">"+x+"</option>"}).join("")+"</select>"}
function editor(){
 var w=wById(edit);if(!w){view="list";return list()}
 var h="<div class='row sp'><button class='btn g s' data-nav='list'>← Voltar</button><button class='btn g s' data-del='1'"+(cf==="del"?" style='background:#dc2626;color:#fff'>Toque para confirmar":">Excluir treino")+"</button></div><label class='ban wbn' style='margin-top:12px' data-im='wb-"+w.id+"'><input type='file' accept='image/*' data-img='wb-"+w.id+"' hidden><span class='ed'>"+(w.bn?"Alterar banner":"+ Adicionar banner (foto, logo...)")+"</span></label>"+(w.bn?"<button class='btn g s' style='margin-top:8px' data-rmbn='1'>Remover banner</button>":"")+"<h2>Nome do treino</h2><input data-k='wname' value='"+esc(w.name)+"'><h2>Descrição</h2><textarea data-k='wdesc' placeholder='Ex.: foco em peito e tríceps, 60 min' style='min-height:80px;font-family:inherit;font-size:15px'>"+esc(w.desc)+"</textarea><h2>Exercícios</h2>";
 w.ex.forEach(function(e,i){
  h+="<div class='card'><div class='row sp'><b>#"+(i+1)+"</b><button class='x' data-rm='"+i+"'>✕</button></div><label>Exercício</label><input data-k='name' data-i='"+i+"' value='"+esc(e.name)+"'><div class='g2'><div><label>Séries</label><input type='number' inputmode='numeric' data-k='sets' data-i='"+i+"' value='"+esc(e.sets)+"'></div><div><label>Repetições</label><input data-k='reps' data-i='"+i+"' value='"+esc(e.reps)+"'></div><div><label>Tipo de set</label>"+sel2(TIPOS,e.type,"type",i)+"</div><div><label>Finalidade</label>"+sel2(FINS,e.goal,"goal",i)+"</div></div><label>Descanso entre séries (segundos)</label><input type='number' inputmode='numeric' data-k='rest' data-i='"+i+"' value='"+esc(e.rest||60)+"'><label>Observação</label><input data-k='note' data-i='"+i+"' value='"+esc(e.note)+"'><label>Vídeo de execução (arquivo ou link)</label><input type='file' accept='video/*' data-file='"+i+"'><input data-k='url' data-i='"+i+"' placeholder='ou cole um link' value='"+esc(e.url)+"' style='margin-top:6px'>"+(e.vid?"<video controls playsinline data-v='"+e.vid+"'></video>":"")+(e.url?"<div style='margin-top:6px'><a style='color:#8ab4ff' target='_blank' rel='noopener' href='"+esc(e.url)+"'>Abrir link</a></div>":"")+"</div>"});
 return h+"<button class='btn' data-add='1'>+ Exercício</button>";
}
function session(){
 var w=wById(ses.w);if(!w){ses=null;view="home";return home()}
 var h="<div class='row sp'><button class='btn g s' data-quit='1'>"+(cf==="quit"?"Confirmar saída":"← Sair")+"</button><span class='mu'>"+DN[ses.day]+"</span></div>"+(w.bn?"<div class='ban wbn' style='margin:12px 0' data-im='wb-"+w.id+"'></div>":"")+"<h1>"+esc(w.name)+"</h1>"+(w.desc?"<div class='mu' style='margin:-8px 0 12px;white-space:pre-wrap'>"+esc(w.desc)+"</div>":"");
